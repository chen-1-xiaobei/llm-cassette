[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cassette"
version = "0.1.0"
description = "Record and replay LLM interactions, so agent behaviour can be tested deterministically and for free"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xiaobei" }]
keywords = ["llm", "agent", "testing", "record-replay", "langchain", "vcr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "langchain-core>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/chen-1-xiaobei/agent-cassette"

[project.scripts]
agent-cassette = "agent_cassette.cli:main"

[tool.setuptools]
packages = ["agent_cassette"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
