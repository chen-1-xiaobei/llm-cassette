name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 单测（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装
        run: pip install -e ".[dev]"
      - name: 运行单测
        env:
          PYTHONUTF8: "1"
        run: pytest
      # 演示固件是可回放入库的，顺手验证 CLI 真的能用
      - name: 冒烟：CLI 可回放演示录像
        run: |
          agent-cassette inspect examples/cassettes/before.json
          agent-cassette diff examples/cassettes/before.json examples/cassettes/before.json
